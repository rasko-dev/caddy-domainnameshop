name: Docker

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  workflow_dispatch:
    inputs:
      caddy_version:
        description: Upstream Caddy image version (for example 2.11.3)
        required: false
        default: ''
  schedule:
    # Run twice daily to catch new upstream releases without excessive CI churn.
    - cron: '23 0,12 * * *'

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}


jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Caddy version
        id: caddy-version
        env:
          REQUESTED_CADDY_VERSION: ${{ github.event.inputs.caddy_version || '' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          get_latest_version() {
            gh api repos/caddyserver/caddy/releases/latest --jq '.tag_name' | sed 's/^v//'
          }

          requested="${REQUESTED_CADDY_VERSION#v}"
          if [ -n "${requested}" ]; then
            resolved_version="${requested}"
          else
            resolved_version="$(get_latest_version)"
          fi

          latest_version="$(get_latest_version)"

          if [ -z "${resolved_version}" ] || [ "${resolved_version}" = "null" ]; then
            echo "Could not resolve a Caddy version."
            exit 1
          fi

          if [[ ! "${resolved_version}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Resolved version '${resolved_version}' is not a supported release version (major.minor.patch)."
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"

          echo "version=${resolved_version}" >> "${GITHUB_OUTPUT}"
          echo "major_minor=${major}.${minor}" >> "${GITHUB_OUTPUT}"
          echo "major=${major}" >> "${GITHUB_OUTPUT}"
          if [ "${resolved_version}" = "${latest_version}" ]; then
            echo "is_latest=true" >> "${GITHUB_OUTPUT}"
          else
            echo "is_latest=false" >> "${GITHUB_OUTPUT}"
          fi

      # Install the cosign tool except on PR
      # https://github.com/sigstore/cosign-installer
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20 #v3.5.0
        with:
          cosign-release: 'v2.2.4'

      # Set up BuildKit Docker container builder to be able to build
      # multi-platform images and export cache
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide whether image build is needed
        id: build-needed
        env:
          TARGET_TAG: ${{ steps.caddy-version.outputs.version }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_build=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TARGET_TAG}" >/dev/null 2>&1; then
            echo "Version ${TARGET_TAG} already published, skipping scheduled build."
            echo "should_build=false" >> "${GITHUB_OUTPUT}"
          else
            echo "Version ${TARGET_TAG} not published yet, building."
            echo "should_build=true" >> "${GITHUB_OUTPUT}"
          fi

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        if: steps.build-needed.outputs.should_build == 'true'
        id: meta
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934 # v5.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.caddy-version.outputs.version }}
            type=raw,value=${{ steps.caddy-version.outputs.major_minor }}
            type=raw,value=${{ steps.caddy-version.outputs.major }}
            type=raw,value=latest,enable=${{ steps.caddy-version.outputs.is_latest == 'true' }}

      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        if: steps.build-needed.outputs.should_build == 'true'
        id: build-and-push
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            CADDY_VERSION=${{ steps.caddy-version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Sign the resulting Docker image digest except on PRs.
      # This will only write to the public Rekor transparency log when the Docker
      # repository is public to avoid leaking data.  If you would like to publish
      # transparency data even for private images, pass --force to cosign below.
      # https://github.com/sigstore/cosign
      - name: Sign the published Docker image
        if: ${{ github.event_name != 'pull_request' && steps.build-needed.outputs.should_build == 'true' }}
        env:
          # https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#using-an-intermediate-environment-variable
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        # This step uses the identity token to provision an ephemeral certificate
        # against the sigstore community Fulcio instance.
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}
