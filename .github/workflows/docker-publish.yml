name: Docker

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  workflow_dispatch:
    inputs:
      caddy_version:
        description: Upstream Caddy image version (for example 2.11.3)
        required: false
        default: ''
  schedule:
    # Run twice daily to catch new upstream releases without excessive CI churn.
    # Use minute 23 to avoid more common top-of-hour scheduler spikes.
    - cron: '23 0,12 * * *'

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}


jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Caddy version
        id: caddy-version
        env:
          REQUESTED_CADDY_VERSION: ${{ github.event.inputs.caddy_version || '' }}
        run: |
          set -euo pipefail

          get_latest_version() {
            local latest_tag
            latest_tag="$(
              curl -fsSL "https://api.github.com/repos/caddyserver/caddy/releases/latest" \
                | awk -F'"' '/"tag_name":/ {print $4; exit}'
            )"

            latest_tag="${latest_tag#v}"
            if [[ ! "${latest_tag}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Could not resolve semantic latest Caddy release tag from GitHub API." >&2
              return 1
            fi

            echo "${latest_tag}"
          }

          requested="${REQUESTED_CADDY_VERSION#v}"
          if [ -n "${requested}" ]; then
            resolved_version="${requested}"
          else
            resolved_version="$(get_latest_version)"
          fi

          latest_version="$(get_latest_version)"

          if [ -z "${resolved_version}" ] || [ "${resolved_version}" = "null" ]; then
            echo "Could not resolve a Caddy version from input or GitHub upstream releases."
            exit 1
          fi

          if [[ ! "${resolved_version}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Resolved version '${resolved_version}' is not a supported release version (major.minor.patch)."
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"

          echo "version=${resolved_version}" >> "${GITHUB_OUTPUT}"
          echo "major_minor=${major}.${minor}" >> "${GITHUB_OUTPUT}"
          echo "major=${major}" >> "${GITHUB_OUTPUT}"
          if [ "${resolved_version}" = "${latest_version}" ]; then
            echo "is_latest=true" >> "${GITHUB_OUTPUT}"
          else
            echo "is_latest=false" >> "${GITHUB_OUTPUT}"
          fi

      # Install the cosign tool except on PR
      # https://github.com/sigstore/cosign-installer
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20 #v3.5.0
        with:
          cosign-release: 'v2.2.4'

      # Set up BuildKit Docker container builder to be able to build
      # multi-platform images and export cache
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide whether image build is needed
        id: build-needed
        env:
          TARGET_TAG: ${{ steps.caddy-version.outputs.version }}
          TARGET_MAJOR_MINOR: ${{ steps.caddy-version.outputs.major_minor }}
          TARGET_MAJOR: ${{ steps.caddy-version.outputs.major }}
          TARGET_IS_LATEST: ${{ steps.caddy-version.outputs.is_latest }}
        run: |
          set -euo pipefail

          check_upstream_tag() {
            local out
            local upstream_ref="docker.io/library/caddy:${TARGET_TAG}"

            if out="$(docker buildx imagetools inspect "${upstream_ref}" 2>&1)"; then
              return 0
            fi

            if echo "${out}" | grep -Eqi "not found|manifest unknown|no such manifest"; then
              return 2
            fi

            echo "Failed to check upstream image ${upstream_ref}: ${out}" >&2
            return 1
          }

          if check_upstream_tag; then
            echo "Upstream caddy:${TARGET_TAG} is available on Docker Hub."
          else
            status=$?
            if [ "${status}" -eq 2 ]; then
              echo "Upstream caddy:${TARGET_TAG} is not available yet on Docker Hub; skipping build for now."
              echo "should_build=false" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            exit 1
          fi

          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_build=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          fetch_digest() {
            local tag="$1"
            local out
            local full_ref="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${tag}"

            if out="$(docker buildx imagetools inspect "${full_ref}" 2>&1)"; then
              local digest
              digest="$(echo "${out}" | awk '/^Digest:/ {print $2; exit}')"
              if [ -z "${digest}" ]; then
                echo "Could not read digest for ${full_ref}. Inspect output: ${out}" >&2
                return 1
              fi
              echo "${digest}"
              return 0
            fi

            if echo "${out}" | grep -Eqi "not found|manifest unknown|no such manifest"; then
              return 2
            fi

            echo "Failed to check ${full_ref}: ${out}" >&2
            return 1
          }

          if exact_digest="$(fetch_digest "${TARGET_TAG}")"; then
            echo "Found digest for ${TARGET_TAG}, checking rolling tags."
          else
            status=$?
            if [ "${status}" -eq 2 ]; then
              echo "Version ${TARGET_TAG} not published yet, building."
              echo "should_build=true" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            exit 1
          fi

          check_tags=("${TARGET_MAJOR_MINOR}" "${TARGET_MAJOR}")
          if [ "${TARGET_IS_LATEST}" = "true" ]; then
            check_tags+=("latest")
          fi

          for tag in "${check_tags[@]}"; do
            if tag_digest="$(fetch_digest "${tag}")"; then
              if [ "${tag_digest}" != "${exact_digest}" ]; then
                echo "Tag ${tag} digest differs from ${TARGET_TAG}, rebuilding."
                echo "should_build=true" >> "${GITHUB_OUTPUT}"
                exit 0
              fi
            else
              status=$?
              if [ "${status}" -eq 2 ]; then
                echo "Tag ${tag} is missing, rebuilding."
                echo "should_build=true" >> "${GITHUB_OUTPUT}"
                exit 0
              fi
              exit 1
            fi
          done

          echo "Version ${TARGET_TAG} and rolling tags are up to date, skipping scheduled build."
          echo "should_build=false" >> "${GITHUB_OUTPUT}"

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        if: steps.build-needed.outputs.should_build == 'true'
        id: meta
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934 # v5.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.caddy-version.outputs.version }}
            type=raw,value=${{ steps.caddy-version.outputs.major_minor }}
            type=raw,value=${{ steps.caddy-version.outputs.major }}
            type=raw,value=latest,enable=${{ steps.caddy-version.outputs.is_latest == 'true' }}

      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        if: steps.build-needed.outputs.should_build == 'true'
        id: build-and-push
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            CADDY_VERSION=${{ steps.caddy-version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Sign the resulting Docker image digest except on PRs.
      # This will only write to the public Rekor transparency log when the Docker
      # repository is public to avoid leaking data.  If you would like to publish
      # transparency data even for private images, pass --force to cosign below.
      # https://github.com/sigstore/cosign
      - name: Sign the published Docker image
        if: ${{ github.event_name != 'pull_request' && steps.build-needed.outputs.should_build == 'true' }}
        env:
          # https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#using-an-intermediate-environment-variable
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        # This step uses the identity token to provision an ephemeral certificate
        # against the sigstore community Fulcio instance.
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}
