name: Docker

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  workflow_dispatch:
    inputs:
      caddy_version:
        description: Upstream Caddy image version (for example 2.11.3)
        required: false
        default: ''
  schedule:
    # Run twice daily to catch new upstream releases without excessive CI churn.
    # Use minute 23 to avoid more common top-of-hour scheduler spikes.
    - cron: '23 0,12 * * *'

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}


jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Caddy version
        id: caddy-version
        env:
          REQUESTED_CADDY_VERSION: ${{ github.event.inputs.caddy_version || '' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          get_latest_version() {
            local latest_tag
            if [ -n "${GITHUB_TOKEN:-}" ]; then
              latest_tag="$(
                curl -fsSL \
                  -u "x-access-token:${GITHUB_TOKEN}" \
                  -H "Accept: application/vnd.github+json" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  -H "User-Agent: caddy-domainnameshop-workflow" \
                  "https://api.github.com/repos/caddyserver/caddy/releases/latest" \
                  | jq -r '.tag_name // empty'
              )"
            else
              latest_tag="$(
                curl -fsSL \
                  -H "Accept: application/vnd.github+json" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  -H "User-Agent: caddy-domainnameshop-workflow" \
                  "https://api.github.com/repos/caddyserver/caddy/releases/latest" \
                  | jq -r '.tag_name // empty'
              )"
            fi

            latest_tag="${latest_tag#v}"
            if [[ ! "${latest_tag}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Could not resolve semantic latest Caddy release tag from GitHub API." >&2
              return 1
            fi

            echo "${latest_tag}"
          }

          semver_gt() {
            local left="$1"
            local right="$2"
            local left_major left_minor left_patch right_major right_minor right_patch

            IFS='.' read -r left_major left_minor left_patch <<< "${left}"
            IFS='.' read -r right_major right_minor right_patch <<< "${right}"

            if [ "${left_major}" -gt "${right_major}" ]; then
              return 0
            fi
            if [ "${left_major}" -lt "${right_major}" ]; then
              return 1
            fi
            if [ "${left_minor}" -gt "${right_minor}" ]; then
              return 0
            fi
            if [ "${left_minor}" -lt "${right_minor}" ]; then
              return 1
            fi
            [ "${left_patch}" -gt "${right_patch}" ]
          }

          fetch_release_versions() {
            local next_url="https://api.github.com/repos/caddyserver/caddy/releases?per_page=100"
            while [ -n "${next_url}" ]; do
              local headers_file
              local response
              headers_file="$(mktemp)"

              if [ -n "${GITHUB_TOKEN:-}" ]; then
                response="$(
                  curl -fsSL \
                    -D "${headers_file}" \
                    -u "x-access-token:${GITHUB_TOKEN}" \
                    -H "Accept: application/vnd.github+json" \
                    -H "X-GitHub-Api-Version: 2022-11-28" \
                    -H "User-Agent: caddy-domainnameshop-workflow" \
                    "${next_url}"
                )"
              else
                response="$(
                  curl -fsSL \
                    -D "${headers_file}" \
                    -H "Accept: application/vnd.github+json" \
                    -H "X-GitHub-Api-Version: 2022-11-28" \
                    -H "User-Agent: caddy-domainnameshop-workflow" \
                    "${next_url}"
                )"
              fi

              echo "${response}" \
                | jq -r '.[] | select((.draft // false) == false and (.prerelease // false) == false) | .tag_name // empty' \
                | sed 's/^v//'

              next_url="$(
                grep -i '^link:' "${headers_file}" \
                  | tr ',' '\n' \
                  | sed -n 's/.*<\([^>]*\)>; rel="next".*/\1/p' \
                  | head -n1 \
                  | tr -d '\r'
              )"
              rm -f "${headers_file}"
            done
          }

          requested="${REQUESTED_CADDY_VERSION#v}"
          if [ -n "${requested}" ]; then
            resolved_version="${requested}"
          else
            resolved_version="$(get_latest_version)"
          fi

          latest_version="$(get_latest_version)"

          if [ -z "${resolved_version}" ] || [ "${resolved_version}" = "null" ]; then
            echo "Could not resolve a Caddy version from input or GitHub upstream releases."
            exit 1
          fi

          if [[ ! "${resolved_version}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Resolved version '${resolved_version}' is not a supported release version (major.minor.patch)."
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"

          echo "version=${resolved_version}" >> "${GITHUB_OUTPUT}"
          echo "major_minor=${major}.${minor}" >> "${GITHUB_OUTPUT}"
          echo "major=${major}" >> "${GITHUB_OUTPUT}"

          enable_major_minor=true
          enable_major=true
          tags_file="$(mktemp)"
          if fetch_release_versions >"${tags_file}"; then
            newest_major_minor=""
            newest_major=""
            while IFS= read -r raw_tag; do
              tag="${raw_tag#v}"
              if [[ ! "${tag}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
                continue
              fi

              tag_major="${BASH_REMATCH[1]}"
              tag_minor="${BASH_REMATCH[2]}"

              if [ "${tag_major}" = "${major}" ] && [ "${tag_minor}" = "${minor}" ]; then
                if [ -z "${newest_major_minor}" ] || semver_gt "${tag}" "${newest_major_minor}"; then
                  newest_major_minor="${tag}"
                fi
              fi

              if [ "${tag_major}" = "${major}" ]; then
                if [ -z "${newest_major}" ] || semver_gt "${tag}" "${newest_major}"; then
                  newest_major="${tag}"
                fi
              fi
            done < "${tags_file}"

            if [ -n "${newest_major_minor}" ] && semver_gt "${newest_major_minor}" "${resolved_version}"; then
              enable_major_minor=false
              echo "Skipping ${major}.${minor} rolling tag because upstream ${newest_major_minor} is newer."
            fi
            if [ -n "${newest_major}" ] && semver_gt "${newest_major}" "${resolved_version}"; then
              enable_major=false
              echo "Skipping ${major} rolling tag because upstream ${newest_major} is newer."
            fi
          else
            echo "Could not inspect upstream releases; keeping rolling tag updates enabled."
          fi
          rm -f "${tags_file}"

          echo "enable_major_minor=${enable_major_minor}" >> "${GITHUB_OUTPUT}"
          echo "enable_major=${enable_major}" >> "${GITHUB_OUTPUT}"
          if [ "${resolved_version}" = "${latest_version}" ]; then
            echo "is_latest=true" >> "${GITHUB_OUTPUT}"
          else
            echo "is_latest=false" >> "${GITHUB_OUTPUT}"
          fi

      # Set up BuildKit Docker container builder to be able to build
      # multi-platform images and export cache
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      # Login against a Docker registry
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide whether image build is needed
        id: build-needed
        env:
          TARGET_TAG: ${{ steps.caddy-version.outputs.version }}
          TARGET_MAJOR_MINOR: ${{ steps.caddy-version.outputs.major_minor }}
          TARGET_MAJOR: ${{ steps.caddy-version.outputs.major }}
          TARGET_IS_LATEST: ${{ steps.caddy-version.outputs.is_latest }}
        run: |
          set -euo pipefail

          check_upstream_tag() {
            local out
            local upstream_ref="docker.io/library/caddy:${TARGET_TAG}"

            if out="$(docker buildx imagetools inspect "${upstream_ref}" 2>&1)"; then
              return 0
            fi

            if echo "${out}" | grep -Eqi "not found|manifest unknown|no such manifest"; then
              return 2
            fi

            echo "Failed to check upstream image ${upstream_ref}: ${out}" >&2
            return 1
          }

          if check_upstream_tag; then
            echo "Upstream caddy:${TARGET_TAG} is available on Docker Hub."
          else
            status=$?
            if [ "${status}" -eq 2 ]; then
              echo "Upstream caddy:${TARGET_TAG} is not available yet on Docker Hub; skipping build for now."
              echo "should_build=false" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            exit 1
          fi

          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_build=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          fetch_digest() {
            local tag="$1"
            local out
            local full_ref="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${tag}"

            if out="$(docker buildx imagetools inspect "${full_ref}" --format '{{json .Manifest}}' 2>&1)"; then
              local digest
              digest="$(echo "${out}" | jq -r '.digest // empty')"
              if [ -z "${digest}" ]; then
                echo "Could not read digest for ${full_ref}. Inspect output: ${out}" >&2
                return 1
              fi
              echo "${digest}"
              return 0
            fi

            if echo "${out}" | grep -Eqi "not found|manifest unknown|no such manifest"; then
              return 2
            fi

            echo "Failed to check ${full_ref}: ${out}" >&2
            return 1
          }

          if exact_digest="$(fetch_digest "${TARGET_TAG}")"; then
            echo "Found digest for ${TARGET_TAG}, checking rolling tags."
          else
            status=$?
            if [ "${status}" -eq 2 ]; then
              echo "Version ${TARGET_TAG} not published yet, building."
              echo "should_build=true" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            exit 1
          fi

          check_tags=("${TARGET_MAJOR_MINOR}" "${TARGET_MAJOR}")
          if [ "${TARGET_IS_LATEST}" = "true" ]; then
            check_tags+=("latest")
          fi

          for tag in "${check_tags[@]}"; do
            if tag_digest="$(fetch_digest "${tag}")"; then
              if [ "${tag_digest}" != "${exact_digest}" ]; then
                echo "Tag ${tag} digest differs from ${TARGET_TAG}, rebuilding."
                echo "should_build=true" >> "${GITHUB_OUTPUT}"
                exit 0
              fi
            else
              status=$?
              if [ "${status}" -eq 2 ]; then
                echo "Tag ${tag} is missing, rebuilding."
                echo "should_build=true" >> "${GITHUB_OUTPUT}"
                exit 0
              fi
              exit 1
            fi
          done

          echo "Version ${TARGET_TAG} and rolling tags are up to date, skipping scheduled build."
          echo "should_build=false" >> "${GITHUB_OUTPUT}"

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        if: steps.build-needed.outputs.should_build == 'true'
        id: meta
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934 # v5.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.caddy-version.outputs.version }}
            type=raw,value=${{ steps.caddy-version.outputs.major_minor }},enable=${{ steps.caddy-version.outputs.enable_major_minor == 'true' }}
            type=raw,value=${{ steps.caddy-version.outputs.major }},enable=${{ steps.caddy-version.outputs.enable_major == 'true' }}
            type=raw,value=latest,enable=${{ steps.caddy-version.outputs.is_latest == 'true' }}

      # Build and push Docker image with Buildx
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        if: steps.build-needed.outputs.should_build == 'true'
        id: build-and-push
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: .
          push: true
          build-args: |
            CADDY_VERSION=${{ steps.caddy-version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
